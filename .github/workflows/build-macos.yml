name: Crear instalador macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Mac Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar codificador MP3
        run: brew install ffmpeg
      - name: Verificar empaquetador y exportación
        run: python3 -m unittest discover -s Tests -v
      - name: Comprobar audio, nombres e historial y compilar Swift
        run: swift test
      - name: Compilar y crear DMG
        id: package
        run: bash scripts/build-macos.sh
      - name: Medir RAM de la ventana en reposo
        run: python3 scripts/profile-memory-macos.py
      - name: Guardar medición de RAM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChaceRecordings-memory-report
          path: dist/memory-report.json
          if-no-files-found: warn
      - name: Guardar instalador
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ChaceRecordings-macOS-Apple-Silicon
          path: dist/ChaceRecordings.dmg
          if-no-files-found: error
