name: Crear instalador macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Mac Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Instalar codificador MP3
        run: brew install ffmpeg
      - name: Verificar empaquetador y exportación
        run: python3 -m unittest discover -s Tests -v
      - name: Compilar y crear DMG
        run: bash scripts/build-macos.sh
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Aire-Audio-macOS-Apple-Silicon
          path: dist/Aire Audio.dmg
          if-no-files-found: error
