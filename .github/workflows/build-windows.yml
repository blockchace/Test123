name: Crear instalador Windows 11
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preparar Media Foundation para las pruebas del servidor
        shell: pwsh
        run: |
          $feature = Get-WindowsFeature Server-Media-Foundation
          if (!$feature.Installed) {
            $result = Install-WindowsFeature Server-Media-Foundation
            if (!$result.Success) { throw "No se pudo instalar Media Foundation en el runner." }
          }
      - name: Compilar, probar y crear instalador
        shell: pwsh
        run: ./windows/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ChaceRecordings-Windows11-x64
          path: |
            dist/ChaceRecordings-Windows11-Setup-x64.exe
            dist/ChaceRecordings-Windows11-win-x64.zip
          if-no-files-found: error
